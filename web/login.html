<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KUBER</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:16px}
  .lock{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:32px 28px 26px;text-align:center}
  .lock img{width:72px;height:72px;border-radius:14px;display:block;margin:0 auto 14px}
  .lock h1{font-size:20px;font-weight:600;letter-spacing:.08em;margin:0}
  .lock .sub{color:var(--muted);font-size:13px;margin:4px 0 22px}
  .boxes{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
  .boxes span{width:44px;height:52px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;font-size:22px;background:var(--surface2);transition:border-color .12s}
  .boxes span.on{border-color:var(--accent)}
  .boxes span.f::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--text)}
  .pinin{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .msg{min-height:20px;font-size:13px;color:var(--neg);margin:10px 0 4px}
  .lock.shake{animation:shake .32s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  @media (prefers-reduced-motion:reduce){.lock.shake{animation:none}}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .keys button{height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:17px;font-family:var(--mono);cursor:pointer}
  .keys button:hover{background:var(--surface2)}
  .keys button:disabled{opacity:.5;cursor:default}
  .foot2{color:var(--faint);font-size:12px;margin-top:16px}
</style>
</head>
<body>
<main class="lock" id="lock">
  <img src="/kuber-logo.png" alt="">
  <h1>KUBER</h1>
  <p class="sub">Enter your PIN to unlock</p>
  <form id="f" autocomplete="off">
    <label for="pin" class="sr">PIN</label>
    <input id="pin" class="pinin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="current-password" autofocus>
    <div class="boxes" id="boxes" aria-hidden="true"></div>
    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
    <div class="keys" id="keys"></div>
  </form>
  <p class="foot2">Runs only on this Mac</p>
</main>
<script>
(() => {
  try { const t = localStorage.getItem("kuber.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  const pin = document.getElementById("pin"), boxes = document.getElementById("boxes"), msg = document.getElementById("msg"), lock = document.getElementById("lock"), keys = document.getElementById("keys");
  let digits = 4, busy = false;
  const draw = () => { const n = pin.value.length; boxes.innerHTML = ""; for (let i = 0; i < Math.max(digits, n); i++) { const s = document.createElement("span"); if (i < n) s.className = "f"; else if (i === n) s.className = "on"; boxes.appendChild(s); } };
  ["1","2","3","4","5","6","7","8","9","⌫","0","→"].forEach(k => { const b = document.createElement("button"); b.type = "button"; b.textContent = k; b.setAttribute("aria-label", k === "⌫" ? "Delete" : k === "→" ? "Unlock" : k); b.onclick = () => { if (k === "⌫") pin.value = pin.value.slice(0, -1); else if (k === "→") submit(); else if (pin.value.length < 8) pin.value += k; draw(); pin.focus(); if (k !== "→" && k !== "⌫" && pin.value.length === digits) submit(); }; keys.appendChild(b); });
  async function submit() {
    if (busy || pin.value.length < 4) return; busy = true; msg.textContent = "";
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin: pin.value }) });
      if (r.ok) { location.replace("/" + location.hash); return; }
      const j = await r.json().catch(() => ({})); msg.textContent = j.error || "Couldn't unlock."; lock.classList.remove("shake"); void lock.offsetWidth; lock.classList.add("shake");
    } catch (e) { msg.textContent = "The KUBER engine isn't responding."; }
    pin.value = ""; draw(); busy = false; pin.focus();
  }
  pin.addEventListener("input", () => { pin.value = pin.value.replace(/\D/g, ""); draw(); if (pin.value.length === digits) submit(); });
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); submit(); });
  document.addEventListener("click", e => { if (!e.target.closest("button")) pin.focus(); });
  fetch("/api/login-info").then(r => r.json()).then(j => { digits = j.digits || 4; draw(); if (j.lockedFor) msg.textContent = `Too many attempts. Try again in ${j.lockedFor} s.`; }).catch(() => draw());
  draw();
})();
</script>
</body>
</html>
